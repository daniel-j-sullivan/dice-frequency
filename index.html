<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Dice Frequency</title>
        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <!-- CSS -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="bg-dark">
        <div class="container">
            <div class="row">
                <div class="col-lg-10 mx-auto border border-danger p-3">
                    <!-- Header + Controls -->
                    <div class="dice-display text-center">
                        <p class="display-6 text-danger mb-2">Dicen Frequency</p>
                        <div class="mb-2">
                            <i class="bi bi-dice-2-fill text-danger fs-2 me-2"></i>
                            <i class="bi bi-dice-5-fill text-danger fs-2"></i>
                        </div>
                        <select id="num-rolls-selector" class="form-select w-auto mx-auto my-2">
                            <option value="">number of rolls...</option>
                        </select>
                        <div class="intro-text small text-muted mb-2">
                            Populate a table of roll percentages by selecting how many times to roll.
                            <br><span class="text-danger">* Button is disabled until a number > 0 is selected.</span>
                        </div>
                        <button class="btn btn-dark disabled" id="dice-roll-btn">Roll Dice</button>
                    </div>

                    <!-- Chart & Table Section -->
                    <div class="stats-display d-none mt-3" id="stats-display">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <canvas id="diceChart"></canvas>
                            </div>
                            <div class="col-md-6 table-wrapper">
                                <table class="table table-bordered table-sm text-center align-middle">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>Total</th>
                                            <th>Times Rolled</th>
                                            <th>Percentage</th>
                                        </tr>
                                    </thead>
                                    <tbody id="dice-stats"></tbody>
                                </table>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Chart JS -->


        <!-- Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <!-- My javascript -->
        <script src="scripts.js"></script>
    </body>

</html>
